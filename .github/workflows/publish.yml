name: Publish to PyPI

# Publishes the package to PyPI whenever a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token secret required.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi # must match the environment named on PyPI (see setup)
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail early if the release tag (e.g. v0.7.0) doesn't match pyproject.toml.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$PKG_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} != pyproject.toml $PKG_VERSION"
            exit 1
          fi

      - run: python -m pip install --upgrade build
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
